[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-contract"
version = "0.1.0"
description = "Tiny CI tool for RAG retrieval regression testing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Pukaphol (Volk) Thienpreecha" }
]
keywords = ["rag", "retrieval", "ci", "testing", "evaluation"]
dependencies = [
  "click>=8.1,<8.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12,<0.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
rag-contract = "rag_contract.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["rag_contract*"]
